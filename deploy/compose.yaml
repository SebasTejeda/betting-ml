# Production deployment (spec 003, T020; docs/deploy.md): Caddy terminates TLS and serves the
# built frontend; the API is reachable only through it. Run from the repository root:
#   docker compose -f deploy/compose.yaml up -d --build
name: betting-ml

services:
  api:
    build: ..
    image: betting-ml:latest
    restart: unless-stopped
    env_file: ../.env # APP_ENV=prod and the secrets; never baked into the image
    environment:
      APP_ENV: prod
      # Only Caddy's X-Forwarded-For is believed (its fixed address on the edge network).
      FORWARDED_ALLOW_IPS: 172.30.0.2
    read_only: true # only the volumes below and /tmp are writable
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - ../data:/app/data # SQLite, backups, caches (owned by uid 10001)
      - ../models:/app/models:ro
      - ../reports:/app/reports:ro
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      edge:
        ipv4_address: 172.30.0.3
    # no "ports": the API is not published, Caddy is the only way in

  caddy:
    image: caddy:2.11.6@sha256:3422ce6de165df66534f9b9ba50efaf457114ec961763cc52f5dbdaac2972d73
    restart: unless-stopped
    depends_on: [api]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN to the public host name, e.g. apuestas.example.com}
    ports:
      - "80:80" # ACME challenge and redirect to https
      - "443:443"
      - "443:443/udp" # HTTP/3
    read_only: true
    tmpfs:
      - /tmp:size=16m
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../frontend/dist:/srv:ro # npm run build
      - caddy_data:/data # certificates and keys
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    networks:
      edge:
        ipv4_address: 172.30.0.2

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  caddy_data:
  caddy_config:
