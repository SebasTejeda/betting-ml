[project]
name = "betting-ml"
version = "0.1.0"
description = "Modelo de ML para predecir partidos de fútbol (1X2), detectar value bets y servirlo con una API REST."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "optuna>=3.6",
    "matplotlib>=3.8",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "pyyaml>=6.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.9",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
    "httpx>=0.27",
    "types-PyYAML",
    "types-requests",
    "nbformat>=5.10",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
]

[project.scripts]
betting-ml = "betting_ml.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/betting_ml"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501", "N803", "N806", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.params.Depends", "fastapi.params.Query"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]

[tool.mypy]
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
check_untyped_defs = false
disallow_untyped_defs = false
warn_unused_ignores = false
files = ["src/betting_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=betting_ml --cov-report=term-missing:skip-covered"
markers = ["network: tests que requieren red (excluidos por defecto en CI)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["betting_ml"]
omit = ["src/betting_ml/cli.py", "src/betting_ml/__main__.py"]

[tool.coverage.report]
fail_under = 60
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
