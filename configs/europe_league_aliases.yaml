# Nombre canónico de clubes que NO son de nuestras 5 ligas (spec 003, T006, checkpoint europeo).
# openfootball cambia el nombre de un mismo club entre temporadas ("PSV Eindhoven" → "PSV",
# "SL Benfica" → "Sport Lisboa e Benfica", "Celtic FC" → "Celtic") y el Elo propio lo trataría
# como un club nuevo. Se aplica a los archivos de liga de openfootball/europe y a los nombres de
# Champions/Europa League antes de calcular el Elo.
# Formato:
#   <país>:
#     <nombre en openfootball>: <nombre canónico>
# Un test exige que, tras aplicar estos alias, ninguna liga del catálogo cambie más de 5 clubes
# entre temporadas consecutivas (ascensos + descensos).
