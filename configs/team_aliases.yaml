# Nombre canónico de equipo ← alias por fuente.
# Formato:
#   teams:
#     <liga>:
#       <Nombre canónico>:
#         football_data: [alias, ...]   # nombres tal como aparecen en football-data.co.uk
#         understat: [alias, ...]       # nombres tal como aparecen en Understat
#         the_odds_api: [alias, ...]    # nombres de The Odds API (si no coinciden con otro alias)
#         openfootball: [alias, ...]    # nombres en openfootball/champions-league (spec 003)
#         clubelo: [alias, ...]         # nombres en ClubElo si no coinciden con el canónico (spec 003)
# Si el nombre en una fuente es idéntico al canónico, basta con listar el equipo con `{}`.
# Todo equipo que no resuelva a un canónico es un ERROR (spec §3).
