name: CI

on:
  push:
  pull_request:

# Read-only token for every job: none of them writes to the repository (spec 003, T019).
permissions:
  contents: read

# Third-party actions are pinned to a commit SHA (a tag can be moved); the comment says which
# release it is. Dependabot proposes the updates.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar dependencias (exactamente las de uv.lock)
        run: uv sync --locked --extra dev
      - name: Ruff (lint, incluye reglas de seguridad S)
        run: uv run ruff check src tests migrations
      - name: Ruff (formato)
        run: uv run ruff format --check src tests migrations
      - name: Mypy
        run: uv run mypy
      - name: Pytest (sin red, con tests/fixtures)
        run: uv run pytest -m "not network"
      - name: Contrato OpenAPI del frontend al día
        run: |
          uv run betting-ml openapi
          git diff --exit-code frontend/src/api/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Tipos generados al día con el contrato
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts
      - name: ESLint y Prettier
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Vitest (MSW, sin red, cobertura ≥ 80 %)
        run: npm run coverage
      - name: Build
        run: npm run build

  # Fails on any finding: known vulnerabilities (high or above in npm), secrets in the history
  # or bandit rules. Same checks as `make security`.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans every commit
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - name: Instalar dependencias (exactamente las de uv.lock)
        run: uv sync --locked --extra dev
      - name: Ruff con reglas de seguridad (bandit, S)
        run: uv run ruff check --select S src tests migrations
      - name: pip-audit (producción y desarrollo, con hashes del lockfile)
        run: |
          uv export --frozen --no-emit-project --extra dev --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit --disable-pip --require-hashes -r "$RUNNER_TEMP/requirements.txt"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: npm audit (altas o críticas, todas las dependencias)
        working-directory: frontend
        run: npm audit --audit-level=high # reads package-lock.json: nothing is installed
      - name: gitleaks (historial completo, binario verificado por SHA-256)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .

  # The image as deployed: read-only root, only /tmp and data/ writable, no capabilities.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Construir la imagen
        run: docker build -t betting-ml:ci .
      - name: Arranque con raíz de solo lectura
        run: |
          docker run -d --name api --read-only --tmpfs /tmp \
            --tmpfs /app/data:uid=10001,gid=10001 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -p 127.0.0.1:8000:8000 betting-ml:ci
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:8000/health
          test "$(docker exec api id -u)" = "10001"
          docker exec api test ! -e /app/.env
          if docker exec api touch /app/src/written 2>/dev/null; then echo "code is writable"; exit 1; fi
          docker exec api betting-ml healthcheck
      - name: Logs del contenedor
        if: always()
        run: docker logs api || true
      - name: Caddyfile y compose válidos
        run: |
          docker run --rm -e DOMAIN=example.test \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.6@sha256:3422ce6de165df66534f9b9ba50efaf457114ec961763cc52f5dbdaac2972d73 \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          touch .env
          DOMAIN=example.test docker compose -f deploy/compose.yaml config --quiet
