name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar dependencias
        run: uv sync --extra dev
      - name: Ruff (lint)
        run: uv run ruff check src tests
      - name: Ruff (formato)
        run: uv run ruff format --check src tests
      - name: Pytest (sin red, con tests/fixtures)
        run: uv run pytest -m "not network"
      - name: Contrato OpenAPI del frontend al día
        run: |
          uv run betting-ml openapi
          git diff --exit-code frontend/src/api/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Tipos generados al día con el contrato
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts
      - name: ESLint y Prettier
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Vitest (MSW, sin red, cobertura ≥ 80 %)
        run: npm run coverage
      - name: Build
        run: npm run build
