name: CI

on:
  push:
  pull_request:

# Read-only token for every job: none of them writes to the repository (spec 003, T019).
permissions:
  contents: read

# Third-party actions are pinned to a commit SHA (a tag can be moved); the comment says which
# release it is. Dependabot proposes the updates.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar dependencias (exactamente las de uv.lock)
        run: uv sync --locked --extra dev
      - name: Ruff (lint, incluye reglas de seguridad S)
        run: uv run ruff check src tests migrations
      - name: Ruff (formato)
        run: uv run ruff format --check src tests migrations
      - name: Mypy
        run: uv run mypy
      - name: Pytest (sin red, con tests/fixtures)
        run: uv run pytest -m "not network"
      - name: Contrato OpenAPI del frontend al día
        run: |
          uv run betting-ml openapi
          git diff --exit-code frontend/src/api/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Tipos generados al día con el contrato
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts
      - name: ESLint y Prettier
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Vitest (MSW, sin red, cobertura ≥ 80 %)
        run: npm run coverage
      - name: Build
        run: npm run build

  # Fails on any finding: known vulnerabilities (high or above in npm), secrets in the history
  # or bandit rules. Same checks as `make security`.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # gitleaks scans every commit
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"
      - name: Instalar dependencias (exactamente las de uv.lock)
        run: uv sync --locked --extra dev
      - name: Ruff con reglas de seguridad (bandit, S)
        run: uv run ruff check --select S src tests migrations
      - name: pip-audit (producción y desarrollo, con hashes del lockfile)
        run: |
          uv export --frozen --no-emit-project --extra dev --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit --disable-pip --require-hashes -r "$RUNNER_TEMP/requirements.txt"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: npm audit (altas o críticas, todas las dependencias)
        working-directory: frontend
        run: npm audit --audit-level=high # reads package-lock.json: nothing is installed
      - name: gitleaks (historial completo, binario verificado por SHA-256)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .
